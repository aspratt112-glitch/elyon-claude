image: /images/products/cleansing-shampoo/image.jpg
description: |-
  Most men's shampoos either under-cleanse, leaving build-up behind, or over-cleanse, stripping the scalp and triggering more oil in response. This formula does neither.

  A gentle, sulfate-free cleanse lifts excess oil, product residue and everyday pollutants, while activated charcoal helps draw out impurities. Your scalp is left balanced and reset, ready for step two.
benefits:
  - Helps deeply cleanse the scalp of excess oil and product build-up
  - Helps rebalance and soothe the scalp environment
  - Helps reduce the look of flakiness and dryness without over-stripping
  - Sulfate-free and suitable for regular use
ingredients:
  - title: Activated charcoal
    text: Highly porous carbon that helps adsorb excess oil, residue and pollutants before they're rinsed away.
  - title: Saw palmetto + zinc PCA
    text: A dual approach to scalp oil regulation, supporting a balanced scalp.
  - title: Baobab + quinoa protein
    text: Plant proteins that help reinforce the hair shaft while you cleanse.
  - title: Caffeine
    text: Supports scalp microcirculation for a well-nourished follicle environment.
howToUse: |-
  Massage into wet hair, focusing on the scalp. Leave for a minute, then rinse thoroughly. Use 2–3 times per week, or as often as you wash. Follow with the Restore Conditioner.
texture: Lightweight gel that lathers clean. Scalp feels balanced and reset.
freeFrom: Sulfates, silicones, PEGs, parabens
seoDescription: >-
  A sulfate-free cleansing shampoo with peppermint and activated charcoal that
  clears scalp build-up without stripping. Step one of the Elyon system.
