name: Restore Conditioner
step: 2
stepLabel: Condition
keyNotes: Ceramides + Plant Proteins
summary: >-
  Rebuilds the hair shaft from within. Helps reduce breakage and supports
  stronger, fuller-feeling hair.
status: coming-soon
image: /images/products/restore-conditioner/image.png
description: >-
  Most conditioners stop at smooth. This one keeps working. While it sits on
  your hair for three to five minutes, proteins, ceramides and scalp actives get
  the contact time they need to make a difference.


  There are no silicones coating the surface. Instead, conditioning comes from
  restoring the lipids and proteins that heat, sun and daily washing wear away,
  so your hair is genuinely stronger, not just coated.
benefits:
  - Helps support visibly thicker, fuller-feeling hair
  - Helps strengthen hair against breakage
  - Helps restore the hair's natural lipid barrier
  - Silicone-free, so nothing builds up on the scalp
ingredients:
  - title: Hair ceramide system
    text: >-
      Replaces the lipids the hair cuticle loses to heat, UV and washing,
      helping reduce moisture loss.
  - title: Baobab + quinoa protein
    text: >-
      Plant proteins that penetrate the hair shaft to improve strength and
      elasticity.
  - title: Panthenol
    text: >-
      Binds moisture within the hair for softness and manageability without
      weight.
  - title: Saw palmetto + zinc PCA
    text: >-
      Continues the scalp support started by the shampoo, with longer contact
      time.
howToUse: >-
  After shampooing, work through your hair and onto the scalp. Leave for 3–5
  minutes, then rinse. Use every time you wash.
texture: Lightweight cream that rinses clean. Smooth, never heavy.
freeFrom: Sulfates, silicones, PEGs, polyquaterniums, parabens
seoDescription: >-
  A silicone-free restoring conditioner with ceramides and plant proteins that
  strengthens hair from within. Step two of the Elyon system.
